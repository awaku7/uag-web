name: Sync avatar-controls frontend bundle (temporary)
on:
  push:
    branches: [ui/avatar-remove-manual-audio-controls]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/avatar-remove-manual-audio-controls
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Commit regenerated frontend asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uag_web/static/index.html src/uag_web/static/assets/index.js src/uag_web/static/assets/index.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: update avatar panel without manual audio buttons"
          git push origin HEAD:ui/avatar-remove-manual-audio-controls
