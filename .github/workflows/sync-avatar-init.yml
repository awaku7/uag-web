name: Sync concurrent avatar startup bundle (temporary)
on:
  push:
    branches: [perf/parallel-avatar-tts-init]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parallel-avatar-tts-init
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Commit generated frontend files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uag_web/static/index.html src/uag_web/static/assets/index.js src/uag_web/static/assets/index.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync concurrent avatar initialization"
          git push origin HEAD:perf/parallel-avatar-tts-init
