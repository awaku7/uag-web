name: Web package
on:
  push:
    branches: [main, repository-baseline]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[test,quality]" build
      - run: npm ci
        working-directory: frontend
      # Verify the checked-in browser bundle before rebuilding it.
      - run: node --test frontend/tests/shipped-latency.test.mjs
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: python -m black --check --diff src tests scripts/setup_avatar.py
      - run: python -m ruff check src tests scripts/setup_avatar.py
      - run: python -m pytest -q tests --durations=20
      - run: python -m build
      - run: python scripts/check_distribution.py
      - run: python scripts/check_installation.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
