name: Web package
on:
  push:
    branches: [main, repository-baseline]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: awaku7/agentcli
          # Public trace API candidate; bundled Web and existing commands remain.
          ref: 4e1b2264b303456b28fc638078e5c146a7e546c4
          path: .uag-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".uag-core[core,web]" -e ".[test,quality]" build
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: python -m black --check src tests
      - run: python -m ruff check src tests
      - run: python -m pytest -q tests --durations=20
      - run: python -m build
      - run: python scripts/check_distribution.py
      - run: python -m build .uag-core --outdir dist/core
      - run: python scripts/check_installation.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
