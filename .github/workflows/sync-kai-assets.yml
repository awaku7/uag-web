name: Refresh Kai frontend assets (temporary)
on:
  push:
    branches: [feat/kai-tts-voice-option]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kai-tts-voice-option
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Commit generated frontend assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uag_web/static/index.html src/uag_web/static/assets/index.js src/uag_web/static/assets/index.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync packaged Kai voice frontend"
          git push origin HEAD:feat/kai-tts-voice-option
