name: Format avatar finalization (temporary)
on:
  push:
    branches: [fix/web-avatar-completion-turn-context]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-avatar-completion-turn-context
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install black
      - name: Format changed worker and regression test
        run: |
          python -m black src/uag_web/agent_worker.py tests/test_web_avatar_turn_finalization.py
          python -m black --check src/uag_web/agent_worker.py tests/test_web_avatar_turn_finalization.py
      - name: Commit Black-format-only update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uag_web/agent_worker.py tests/test_web_avatar_turn_finalization.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format authenticated avatar finalization with Black"
          git push origin HEAD:fix/web-avatar-completion-turn-context
