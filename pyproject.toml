[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uag-web"
version = "0.1.0.dev0"
description = "Independent Web application for Universal AI Gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
# Development pin: accepted main with PR #330; no core source changes.
# Replace the VCS dependency with a released version before publishing to PyPI.
dependencies = [
  "uag[core,web] @ git+https://github.com/awaku7/agentcli.git@71c5cd7757b3d7f35f292986b06a4596a08eb58f",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.22",
  "websockets>=16.0",
]

[project.scripts]
uagav = "uag_web.server:main"

[project.optional-dependencies]
quality = ["black==26.10.0", "ruff==0.16.10"]
test = ["pytest", "httpx", "PyJWT[crypto]>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uag_web = ["static/**/*", "templates/**/*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
